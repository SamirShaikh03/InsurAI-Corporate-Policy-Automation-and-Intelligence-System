spring.application.name=insurai-backend

# Server Configuration
server.port=${PORT:8080}

# Database configuration - MySQL (Local Development)
# For production on Render, use SPRING_PROFILES_ACTIVE=postgresql
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/insurai_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Malan@123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Spring Boot settings
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Supabase S3 configuration
# IMPORTANT: Set Supabase credentials as environment variables
supabase.url=${SUPABASE_URL:}
supabase.accessKey=${SUPABASE_ACCESS_KEY:}
supabase.secretKey=${SUPABASE_SECRET_KEY:}
supabase.bucket=Insur_AI
supabase.region=ap-south-1

# Static resources
spring.web.resources.static-locations=file:./uploads/

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.debug=true

# API Keys
# IMPORTANT: Set API keys as environment variables
cohere.api.key=${COHERE_API_KEY:}
